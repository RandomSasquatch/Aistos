<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aistos Setup & Migration</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header"><h1>Aistos Setup & Migration</h1></header>

    <section class="panel">
      <h2 class="panel-title">1. Auto-Detect Active Logins</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem;">Scan persistent cookies to assign logged-in sites to your Personal Vault.</p>
      <button id="btn-scan" class="btn">Scan Active Logins</button>
      <div id="scan-results" style="display: none; margin-top: 1.5rem;">
        <ul id="detected-logins-list" style="list-style: none; margin-bottom: 1rem;"></ul>
        <button id="btn-commit-logins" class="btn" style="display: none;">Commit Selected to Vault</button>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">2. Import from Cookie AutoDelete (CAD)</h2>
      <div id="cad-dropzone" style="border: 2px dashed var(--border-subtle); padding: 2rem; text-align: center; border-radius: 8px; cursor: pointer;">
        <p>Drag & Drop CAD Backup.json here or click to select file</p>
        <input type="file" id="cad-file-input" accept=".json" style="display: none;">
        <div id="cad-status" style="margin-top: 1rem; font-weight: 600;"></div>
      </div>
    </section>

    <button id="btn-finish" class="btn" style="width: 100%; margin-top: 1rem;">Finish Setup & Open Dashboard</button>
  </div>
  <script src="migration.js" type="module"></script>
</body>
</html>
