<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="extensionName">Aistos Dashboard</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="container">
    <!-- Main Dashboard Header -->
    <h2 data-i18n="optionsDashboardTitle">Aistos Vaults & Firewall</h2>
    
    <!-- Domain Vault Management Card -->
    <div class="card">
      <h3 data-i18n="optionsDomainVaultsTitle">Domain Vaults (Rule Priority)</h3>
      <p data-i18n="optionsDomainVaultsDesc">Drag and drop rules to set priority. The top-most matching rule wins.</p>
      
      <!-- Rule Addition Control Group -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="text" id="new-domain" data-i18n="optionsInputPlaceholder" placeholder="e.g. github.com" style="flex: 1; padding: 8px;">
        <select id="new-container" style="padding: 8px;" aria-label="Target Container">
          <option value="firefox-default" data-i18n="optionsDefaultContainerOption">Default (No Container)</option>
        </select>
        <button id="btn-add-rule" class="btn" data-i18n="optionsBtnAddRule">Add Rule</button>
      </div>

      <!-- Native Drag-and-Drop Sortable Rule List -->
      <ul id="rules-list" class="sortable-list">
        <!-- Dynamically populated via options.js -->
      </ul>
    </div>

    <!-- Global Privacy Protections Card -->
    <div class="card">
      <h3 data-i18n="optionsPrivacyTogglesTitle">Global Privacy Toggles</h3>
      <label style="display: block; margin-bottom: 10px; cursor: pointer;">
        <input type="checkbox" id="toggle-dnr" checked> 
        <span data-i18n="optionsToggleDNR">Enable Native Ad & Tracker Blocking (DNR)</span>
      </label>
      <label style="display: block; margin-bottom: 10px; cursor: pointer;">
        <input type="checkbox" id="toggle-cname" checked> 
        <span data-i18n="optionsToggleCNAME">Enable CNAME Uncloaking (DNS Resolution)</span>
      </label>
    </div>
  </div>

  <!-- Zero-Framework Controllers -->
  <script type="module" src="options.js"></script>
  <script type="module" src="../i18n_renderer.js"></script>
</body>
</html>
