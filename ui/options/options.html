<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aistos - Security Dashboard</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header"><h1>Aistos Engine: Domain Vaults</h1></header>

    <section class="panel">
      <h2 class="panel-title">Zero-Trust Architecture Configuration</h2>
      <div class="input-group">
        <input type="text" id="new-domain" placeholder="e.g., github.com">
        <select id="new-container"></select>
        <button id="btn-add-rule" class="btn">Add Route</button>
      </div>
      <ul id="rules-list"></ul>
    </section>
  </div>
  <script src="options.js" type="module"></script>
</body>
</html>
