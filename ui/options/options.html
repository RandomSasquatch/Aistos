<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aistos - Security Dashboard</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <h1>Aistos Engine</h1>
      <p style="color: var(--text-muted); margin-top: 5px;">Zero-Trust Architecture Configuration</p>
    </header>

    <main>
      <section class="panel">
        <h2 class="panel-title">Domain Vault Rules</h2>
        
        <div class="input-group">
          <input type="text" id="new-domain" placeholder="e.g., mail.proton.me" autocomplete="off">
          <select id="new-container">
            <!-- Options dynamically injected -->
          </select>
          <button id="btn-add-rule" class="btn">Add Route</button>
        </div>

        <ul id="rules-list">
          <!-- Vault items dynamically injected -->
        </ul>
      </section>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
