<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../common.css">
  <style>
    body {
      padding: 1.15rem;
      min-width: 320px;
      max-width: 360px;
      background: var(--bg-surface);
      margin: 0;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1rem;
    }

    .popup-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-brand img {
      width: 24px;
      height: 24px;
    }

    .popup-brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-success);
      box-shadow: 0 0 8px var(--accent-success-glow);
    }

    .tab-hud {
      background: var(--bg-core);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      margin-bottom: 1rem;
    }

    .hud-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
      display: flex;
      justify-content: space-between;
    }

    .hud-domain {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 0.5rem;
    }

    .hud-pills {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .btn-hero {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
    }

    .btn-hero:hover {
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.4);
    }

    .badge-count {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
      margin-left: auto;
    }

    .telemetry-bar {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .telemetry-bar strong {
      color: var(--text-main);
      font-family: var(--font-mono);
    }

    .quick-link {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .quick-link:hover {
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-brand">
      <img src="../../icons/aistos-32.png" alt="Aistos">
      <div>
        <h1 data-i18n="extensionName">Aistos</h1>
      </div>
      <span class="status-dot" title="Zero-Trust Shield Active"></span>
    </div>
    <button id="btn-open-options" class="quick-link" title="Open Security Dashboard">
      ⚙️ Dashboard
    </button>
  </div>

  <!-- Active Tab Context HUD -->
  <div class="tab-hud">
    <div class="hud-label">
      <span>Active Session</span>
      <span id="tab-isolation-status" style="color: var(--accent-success);">Protected</span>
    </div>
    <div id="active-domain" class="hud-domain">Loading active tab...</div>
    <div class="hud-pills">
      <span id="active-container-badge" class="badge badge-vault">Default Workspace</span>
      <span id="stealth-badge" class="badge badge-safe">DNR Shield On</span>
    </div>
  </div>

  <!-- Primary Interactive Actions -->
  <div class="actions-stack">
    <button id="btn-new-burner" class="btn primary btn-hero">
      <span>⚡ Launch Burner Workspace</span>
    </button>

    <button id="btn-save-workspace" class="btn secondary">
      <span>💾 Convert to Permanent Vault</span>
    </button>

    <button id="btn-panic" class="btn secondary">
      <span>🛑 Discard Background Tabs</span>
    </button>

    <button id="btn-vaporize-all" class="btn danger">
      <span>💥 Vaporize All Burners</span>
      <span id="active-burner-count" class="badge-count">0</span>
    </button>
  </div>

  <!-- Bottom Telemetry Bar -->
  <div class="telemetry-bar">
    <span>Trackers: <strong id="telemetry-trackers">0</strong></span>
    <span>Scrubbed: <strong id="telemetry-scrubbed">0</strong></span>
    <span>RAM: <strong style="color: var(--accent-success);">&lt; 10 MB</strong></span>
  </div>

  <script src="../browser-polyfill.js"></script>
  <script type="module" src="popup.js"></script>
  <script type="module" src="../i18n_renderer.js"></script>
</body>
</html>
