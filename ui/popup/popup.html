<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Extension Toolbar Header -->
  <div class="header">
    <h1 data-i18n="extensionName">Aistos</h1>
    <span class="subtitle" data-i18n="extensionDescription">Zero-Trust Sandbox</span>
  </div>
  
  <!-- Interactive Action Controls -->
  <div class="content">
    <button id="btn-new-burner" class="btn primary" data-i18n="popupBtnNewBurner">Launch Burner Workspace</button>
    <button id="btn-save-workspace" class="btn secondary" data-i18n="popupBtnSaveWorkspace">Save Current Workspace</button>
    <hr style="border: 0; border-top: 1px solid var(--border-color, #e0e0e0); margin: 12px 0;">
    <button id="btn-vaporize-all" class="btn danger" data-i18n="popupBtnVaporizeAll">Vaporize All Sessions</button>
  </div>

  <!-- Zero-Framework Controllers (Unified as type="module") -->
  <script type="module" src="popup.js"></script>
  <script type="module" src="../i18n_renderer.js"></script>
</body>
</html>
